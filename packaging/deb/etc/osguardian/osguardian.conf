# /etc/osguardian/osguardian.conf
# OS Guardian Autonomous Daemon Configuration

[general]
daemon_name = osguardiand
socket_path = /run/osguardian/osguardian.sock
log_level = INFO
log_file = /var/log/osguardian/osguardian.log

[telemetry]
sample_interval_ms = 1000
history_window_ticks = 60
ewma_alpha = 0.2

[thresholds]
cpu_anomaly_pct = 85.0
mem_anomaly_pct = 80.0
max_child_threads = 64

[policy]
least_disruptive_action = true
allow_auto_remediation = true
protected_processes = systemd,init,sshd,dockerd,containerd,login,bash,zsh,osguardiand
